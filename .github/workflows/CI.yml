name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      # PythonCall must load for `using TokToxStability`, but the tests never call into Python.
      # Use a plain system Python (as the notebooks use a venv) instead of CondaPkg, whose
      # auto-managed env breaks inside Pkg.test's sandbox and on Julia nightly.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Point PythonCall at that Python
        run: |
          echo "JULIA_CONDAPKG_BACKEND=Null" >> "$GITHUB_ENV"
          echo "JULIA_PYTHONCALL_EXE=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
